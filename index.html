<script>
// 3D
let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

let geo=new THREE.TorusKnotGeometry(1,0.3,100,16);
let mat=new THREE.MeshStandardMaterial({color:0x00f7ff});
let obj=new THREE.Mesh(geo,mat);
scene.add(obj);

scene.add(new THREE.PointLight(0xffffff,1).position.set(5,5,5));
scene.add(new THREE.AmbientLight(0x404040));
camera.position.z=4;

function animate(){
requestAnimationFrame(animate);
obj.rotation.x+=0.01;
obj.rotation.y+=0.01;
renderer.render(scene,camera);
}

// CHAT
function toggleChat(){
let box=document.getElementById('chatBox');
box.style.display=box.style.display==='flex'?'none':'flex';
box.style.flexDirection='column';

// LANGUAGE DETECT (simple)
function detectLang(text){
if(/[\u0600-\u06FF]/.test(text)) return 'ur-PK';
if(/[a-zA-Z]/.test(text)) return 'en-US';
return 'hi-IN';
}

// VOICE SPEAK
function speak(text,lang){
let s=new SpeechSynthesisUtterance(text);
s.lang=lang;
window.speechSynthesis.speak(s);
}

async function send(){
